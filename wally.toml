[package]
name = "your-user/your-game"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
# React itself is only the element and hook half. `react-roblox` is the renderer —
# createRoot, createPortal — and without it there is nothing to mount a tree onto an
# Instance with. Keep the two pinned to the same version.
react = "jsdotlua/react@17.2.1"
react-roblox = "jsdotlua/react-roblox@17.2.1"
# Charm is the state library the client stores are built on: an atom is a value plus a
# subscription, it notifies only when the value actually changes, and it reaches for nothing
# outside the Luau standard library — which is what lets `make test ONLY=ui` load every store
# offline and assert its rules without a DataModel.
charm = "littensy/charm@0.11.0"
# Signals, for the seams Charm is the wrong shape for. An atom is a *value* that notifies when
# it changes and dedupes when it does not; a signal is an *event* with no current value to read.
# Reach for this when there is nothing to store — "the round ended", "this was clicked" — and for
# an atom whenever a component would want to render the state.
signalplus = "alexanderlindholt/signalplus@3.7.2"
